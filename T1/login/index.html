<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">
    <title>Registro Calidad de Vida</title>
</head>
<body>
    <h1>Área de Calidad de Vida DCC</h1>

    <h2>Registro de usuario</h2>

    <form id="login-form">

        <label for="names">Nombres: <br>(ingrese al menos 1 letra)</label>
        <br>
        <input id="names" name="names" type="text">
        <br>
        <label for="surnames">Apellidos: <br>(ingrese al menos 1 letra)</label>
        <br>
        <input id="surnames" name="surnames" type="text">
        <br>
        <label for="member-type">Tipo de miembro:</label>
        <br>
        <select id="member-type" name="member-type">
            <option value="">-- Elija una opción --</option>
            <option value="pre-grado">Estudiante de Pregrado</option>
            <option value="post-grado">Estudiante de Postgrado</option>
            <option value="funcionario">Funcionario</option>
            <option value="academico">Académico</option>
        </select>
        <br>
        <label for="phone">Número de telefono: (+56 9) <br>(ingrese 8 números)</label>
        <br>
        <input id="phone" name="phone" type="number">
        <br>
        <label for="email">Correo: <br>(Ej: abc@abc.abc)</label>
        <br>
        <input id="email" name="email" type="email">
        <br>
        <label for="password">Contraseña: <br>- un numero<br>- largo 8<br>- una mayuscula<br>- una minuscula<br>- un carácter especial</label>
        <br>
        <input id="password" name="password" type="password">
        <br>
        <label for="password-confirm">
            Reingrese la contraseña:
            <div class="warning" id="warning">Las contraseñas no son iguales
            </div>
        </label>
        <br>
        <input id="password-confirm" name="password-confirm" type="password">
        <br>
        <button type="button" id="registrar">Registrar</button>
        <br>
        <a href="../activities/">
            <button type="button" id="invitado">Ingresar como invitado</button>
        </a>
        <br>
        <a href="../members/">
            <button type="button" id="miebros">Miembros!</button>
        </a>
        <br>
        <a href="../statistics/">
            <button type="button" id="estadisticas">Estadísticas!</button>
        </a>
    </form>
    <script lang="javascript" src="login.js"></script>
</body>
</html>
