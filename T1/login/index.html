<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro Calidad de Vida</title>
</head>
<body>
    <h1>Área de Calidad de Vida DCC</h1>

    <h2>Registro de usuario</h2>

    <form id="login-form">

        <label for="names">Nombres:</label>
        <br>
        <input id="names" name="names" type="text">
        <br>
        <label for="surnames">Apellidos:</label>
        <br>
        <input id="surnames" name="surnames" type="text">
        <br>
        <label for="member-type">Tipo de miembro:</label>
        <br>
        <select id="member-type" name="member-type">
            <option value="">-- Elija una opción --</option>
            <option value="pre-grado">Estudiante de Pregrado</option>
            <option value="post-grado">Estudiante de Postgrado</option>
            <option value="funcionario">Funcionario</option>
            <option value="academico">Académico</option>
        </select>
        <br>
        <label for="phone">Número de telefono: (+56 9)</label>
        <br>
        <input id="phone" name="phone" type="number">
        <br>
        <label for="email">Correo:</label>
        <br>
        <input id="email" name="email" type="email">
        <br>
        <label for="password">Contraseña:</label>
        <br>
        <input id="password" name="password" type="password">
        <br>
        <label for="password-confirm">Reingrese la contraseña:</label>
        <br>
        <input id="password-confirm" name="password-confirm" type="password">
        <br>
        <button type="button" id="registrar">Registrar</button>

    </form>
    <script lang="javascript" src="login.js"></script>
</body>
</html>
