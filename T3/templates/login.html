{% extends 'base.html' %}

{% block title %}

Log-in

{% endblock %}

{% block css %}

<link
    rel="stylesheet"
    href="{{ url_for('static', filename='css/registrar.css') }}"
/>

{% endblock %}

{% block content %}
<section>
    <form id="log-in-form" method="post">
        {% if error %}
        <p>
          {{ error }}
        </p>
        {% endif %}
        <label for="email">Correo:</label>
        <br>
        <input id="email" name="email" type="email" required>
        <br>
        <label for="password">Contraseña:</label>
        <br>
        <input id="password" name="password" type="password" required>
        <br>
        <button type="button" id="registrar">Registrar</button>
    </form>
    <p>¿No tienes una cuenta? Registrate <a href="{{ url_for('registrar')}}">aquí</a></p>
</section>
{% endblock %}
