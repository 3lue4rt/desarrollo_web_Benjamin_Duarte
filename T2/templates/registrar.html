{% extends 'base.html' %}

{% block title %}

Log-in

{% endblock %}

{% block css %}

<link
    rel="stylesheet"
    href="{{ url_for('static', filename='css/registrar.css') }}"
/>

{% endblock %}

{% block content %}
<section>
    <form id="login-form">
        <label for="names">Nombres:</label>
        <br>
        <input id="names" name="names" type="text" minlength="1" required>
        <br>
        <label for="surnames">Apellidos:</label>
        <br>
        <input id="surnames" name="surnames" type="text" minlength="1" required>
        <br>
        <label for="member-type">Tipo de miembro:</label>
        <br>
        <select id="member-type" name="member-type" required>
            <option value="">-- Elija una opción --</option>
            <option value="pre-grado">Estudiante de Pregrado</option>
            <option value="post-grado">Estudiante de Postgrado</option>
            <option value="funcionario">Funcionario</option>
            <option value="academico">Académico</option>
        </select>
        <br>
        <label for="phone">Número de telefono:</label>
        <br>
        <input id="phone" name="phone" type="number" required>
        <br>
        <label for="email">Correo:</label>
        <br>
        <input id="email" name="email" type="email" required>
        <br>
        <label for="password">Contraseña:</label>
        <br>
        <input id="password" name="password" type="password" required>
        <br>
        <label for="password-confirm">Reingrese la contraseña:</label>
        <br>
        <input id="password-confirm" name="password-confirm" type="password" required>
        <br>
        <button type="button" id="registrar">Registrar</button>
    </form>
    <p>¿Ya tienes una cuenta? Ingresa <a href="{{ url_for('login')}}">aquí</a></p>
</section>
{% endblock %}
{% block javascript %}
    <script src="{{ url_for('static', filename='js/registrar.js')}}"></script>
{% endblock %}
